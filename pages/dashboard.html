<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Routing to Portal | Stackly Real Estate</title>
    <link rel="icon" type="image/webp" href="../assets/images/stackly-logo.webp" />
    <link rel="stylesheet" href="../assets/css/main.css" />
    <script src="../assets/js/store.js"></script>
    <script>
      (function () {
        var user = window.StacklyStore.getCurrentUser();
        if (!user) {
          window.location.replace("sign-in.html");
          return;
        }
        var role = (user.role || "Buyer").toLowerCase();
        if (!["buyer", "seller", "agent", "manager"].includes(role)) {
          role = "buyer";
        }
        window.location.replace("dashboard-" + role + ".html");
      })();
    </script>
  </head>
  <body
    style="
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #1b2032;
      color: #ffffff;
      font-family: &quot;Poppins&quot;, sans-serif;
      text-align: center;
    "
  >
    <div>
      <img
        src="../assets/images/stackly-logo.webp"
        alt="Stackly"
        width="160"
        height="52"
        style="margin-bottom: 1.5rem"
      />
      <div style="font-size: 1.15rem; font-weight: 600">
        Opening your dedicated portal...
      </div>
      <p style="font-size: 0.85rem; color: #94a3b8; margin-top: 0.5rem">
        Redirecting to role-specific operations console.
      </p>
    </div>
  </body>
</html>
