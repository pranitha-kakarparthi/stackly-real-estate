<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Portal & Dashboard | Stackly Real Estate</title>
    <meta
      name="description"
      content="Role-adaptive dashboard for Stackly real estate clients, brokers, sellers, and administrators."
    />

    <!-- Favicon -->
    <link rel="icon" type="image/webp" href="assets/images/stackly-logo.webp" />

    <!-- Stylesheets -->
    <link rel="stylesheet" href="assets/css/main.css" />
    <link rel="stylesheet" href="assets/css/components.css" />
    <link rel="stylesheet" href="assets/css/dashboard.css" />
  </head>
  <body class="dashboard-body">
    <!-- Dashboard Sidebar -->
    <aside class="dashboard-sidebar">
      <div class="sidebar-header">
        <a href="index.html" aria-label="Stackly Home">
          <img
            src="assets/images/stackly-logo.webp"
            alt="Stackly"
            class="sidebar-logo-img"
            width="120"
            height="38"
          />
        </a>
      </div>

      <!-- Active User & Role Display -->
      <div class="sidebar-role-indicator">
        <div class="sidebar-avatar dash-user-initials">US</div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name dash-user-name">Loading User...</div>
          <span class="sidebar-role-badge dash-user-role">CUSTOMER</span>
        </div>
      </div>

      <!-- Navigation Menu Items -->
      <nav class="sidebar-nav">
        <span class="nav-section-title">Core Operations</span>
        <a href="dashboard.html" class="sidebar-link active">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <rect x="3" y="3" width="7" height="7" />
            <rect x="14" y="3" width="7" height="7" />
            <rect x="14" y="14" width="7" height="7" />
            <rect x="3" y="14" width="7" height="7" />
          </svg>
          <span>Overview Dashboard</span>
        </a>
        <a href="properties.html" class="sidebar-link">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
          </svg>
          <span>Explore Catalogue</span>
        </a>
        <a href="contact.html" class="sidebar-link">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"
            />
          </svg>
          <span>Advisory Desk</span>
        </a>

        <span class="nav-section-title" style="margin-top: 1rem"
          >Platform Shortcuts</span
        >
        <a href="pricing.html" class="sidebar-link">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <polygon
              points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"
            />
          </svg>
          <span>Upgrade Plan</span>
        </a>
        <a href="404.html" class="sidebar-link action-404">
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="12" cy="12" r="3" />
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"
            />
          </svg>
          <span>Account Settings</span>
        </a>
      </nav>

      <!-- Sidebar Footer with Sign Out -->
      <div class="sidebar-footer">
        <button
          class="btn btn-outline btn-block btn-sm dash-signout-btn"
          style="color: #cbd5e1; border-color: rgba(255, 255, 255, 0.2)"
        >
          <svg
            width="15"
            height="15"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <polyline points="16 17 21 12 16 7" />
            <line x1="21" y1="12" x2="9" y2="12" />
          </svg>
          <span>Sign Out</span>
        </button>
      </div>
    </aside>

    <!-- Main Dashboard Work Area -->
    <main class="dashboard-main">
      <!-- Topbar: Dynamic Greeting by Time, User Info, Notifications, Sign Out CTA -->
      <header class="dashboard-topbar">
        <div class="topbar-left">
          <button
            id="dash-sidebar-toggle"
            class="sidebar-toggle-btn"
            aria-label="Toggle navigation drawer"
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <line x1="3" y1="12" x2="21" y2="12" />
              <line x1="3" y1="6" x2="21" y2="6" />
              <line x1="3" y1="18" x2="21" y2="18" />
            </svg>
          </button>
          <div>
            <h2 class="dashboard-greeting-title" id="dash-greeting-text">
              Welcome back!
            </h2>
            <div class="dashboard-greeting-sub">
              Session: <span class="status-pill status-active">Active</span> •
              Last Login: <span id="dash-last-login">Just now</span>
            </div>
          </div>
        </div>

        <div class="topbar-right">
          <!-- Notification Bell -->
          <div class="notif-wrap">
            <button
              class="notif-btn"
              id="dash-notif-btn"
              aria-label="View notifications"
            >
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
                <path d="M13.73 21a2 2 0 0 1-3.46 0" />
              </svg>
              <span class="notif-badge" id="dash-notif-badge">2</span>
            </button>
            <div class="notif-dropdown" id="dash-notif-dropdown">
              <div class="notif-header">
                <span>Notifications</span>
                <span
                  style="
                    color: var(--color-primary);
                    font-size: 0.75rem;
                    cursor: pointer;
                  "
                  >Mark read</span
                >
              </div>
              <div id="dash-notif-list"></div>
            </div>
          </div>

          <!-- User Profile Pill -->
          <div class="user-menu-btn">
            <div
              class="sidebar-avatar dash-user-initials"
              style="width: 32px; height: 32px; font-size: 0.8125rem"
            >
              US
            </div>
            <span
              style="
                font-size: 0.875rem;
                font-weight: 600;
                color: var(--color-dark);
              "
              class="dash-user-name"
              >User</span
            >
          </div>

          <!-- Primary Sign Out Button -->
          <button class="btn btn-outline btn-sm dash-signout-btn">
            Sign Out
          </button>
        </div>
      </header>

      <!-- Role-Dynamic Content Injected by dashboard.js (Admin, Agent, Buyer, Seller, Manager) -->
      <div class="dashboard-content" id="role-dynamic-content">
        <!-- Injected dynamically based on user.role -->
      </div>
    </main>

    <script src="assets/js/store.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/dashboard.js"></script>
  </body>
</html>
